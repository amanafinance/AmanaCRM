name: Бэкап базы

on:
  schedule:
    - cron: '7 0 * * *'   # каждый день ~03:07 по Москве
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix tools --no-audit --no-fund
      - name: Выгрузка Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/backup.mjs backup
      - name: Шифрование (в бэкапе персональные данные клиентов)
        env:
          BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          test -n "$BACKUP_PASSWORD" || { echo "Не задан секрет BACKUP_PASSWORD"; exit 1; }
          for f in backup/*.json.gz; do
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$f" -out "$f.enc" -pass env:BACKUP_PASSWORD
            rm "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: amana-crm-backup-${{ github.run_id }}
          path: backup/*.enc
          retention-days: 90
